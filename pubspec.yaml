name: hanna_fitness
description: "Hanna Fitness — premium gym management (members, fees, attendance, trainers, reports, cloud sync) by Hanna Solutions."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database (Windows par FFI wala SQLite)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24

  # Online sync (mobile + PC, multiple devices) — Firestore
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  connectivity_plus: ^6.0.3

  # App
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0       # fingerprint login / app lock
  crypto: ^3.0.3           # password hash
  cryptography: ^2.7.0     # license key (Ed25519) verify — offline
  uuid: ^4.4.0
  url_launcher: ^6.3.0     # WhatsApp / call

  # Backup, receipts, member card
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  pdf: ^3.11.1
  printing: ^5.13.1

  # Member photo + phone contacts
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    # Urdu: screen + PDF (lib/utils/pdf_urdu.dart) dono isi se.
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
